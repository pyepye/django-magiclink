[project]
name = "django-magiclink"
version = "1.4.0"
description = "Passwordless authentication for Django with Magic Links"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Matt Pye", email = "pyematt@gmail.com" }]
keywords = ["magic link", "authentication", "passwordless"]
requires-python = ">=3.11"
dependencies = [
    "Django>=2.1",
    "packaging>=20.9",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://github.com/pyepye/django-magiclink"
Repository = "https://github.com/pyepye/django-magiclink"

[dependency-groups]
test = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-mock>=3.17.0",
    "time-machine>=3.6.0",
]
lint = [
    "ruff>=0.17.3",
]
types = [
    "django-stubs>=6.1.2",
    "mypy>=2.4.1",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "types" },
    "tox>=4.67.4",
    "tox-uv>=1.37.2",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "magiclink"
module-root = ""
source-exclude = ["**/.DS_Store"]
wheel-exclude = ["**/.DS_Store"]

[tool.pytest]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--cov=magiclink",
    "--cov-report=term-missing",
]
filterwarnings = ["error"]

[tool.tox]
requires = ["tox>=4.67.4", "tox-uv>=1.37.2"]
env_list = [
    { product = [["3.11", "3.12", "3.13", "3.14"], ["django52"]] },
    { product = [["3.12", "3.13", "3.14"], ["django60"]] },
    { product = [["3.12", "3.13", "3.14", "3.15"], ["django61"]] },
]

[tool.tox.env_run_base]
description = "Run tests under {base_python}"
dependency_groups = ["test"]
set_env = { COVERAGE_FILE = "{env_dir}{/}.coverage" }
deps = [
    { replace = "if", condition = "factor.django52", then = ["Django>=5.2,<5.3"], extend = true },
    { replace = "if", condition = "factor.django60", then = ["Django>=6.0,<6.1"], extend = true },
    { replace = "if", condition = "factor.django61", then = ["Django>=6.1,<6.2"], extend = true },
]
commands = [["pytest", { replace = "posargs", extend = true }]]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "DJ", "ASYNC", "RUF100"]
ignore = ["E501"]
