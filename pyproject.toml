[project]
name = "django-magiclink"
version = "1.4.0"
description = "Passwordless authentication for Django with Magic Links"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Matt Pye", email = "pyematt@gmail.com" }]
keywords = ["magic link", "authentication", "passwordless"]
requires-python = ">=3.11"
dependencies = [
    "Django>=2.1",
    "packaging>=20.9",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://github.com/pyepye/django-magiclink"
Repository = "https://github.com/pyepye/django-magiclink"

[dependency-groups]
test = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-mock>=3.17.0",
    "time-machine>=3.6.0",
]
lint = [
    "ruff>=0.17.3",
]
types = [
    "django-stubs>=6.1.2",
    "mypy>=2.4.1",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "types" },
    "tox>=4.67.4",
    "tox-uv>=1.37.2",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "magiclink"
module-root = ""
source-exclude = ["**/.DS_Store"]
wheel-exclude = ["**/.DS_Store"]
