<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Django MagicLink Log in - Please override this template</title>
  <meta name="description" content="Django MagicLink">
  <meta name="author" content="Django MagicLink">
</head>

<body>
  <h1>Log in</h1>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Log in</button>
  </form>

  <p>If you are seeing this you have not yet overridden the 'MAGICLINK_LOGIN_CONFIRM_TEMPLATE_NAME' setting yet.</p>
  <p>Please see the <a href="https://github.com/pyepye/django-magiclink">README on Github</a> for more details on setting up django-magiclink correctly</p>
</body>
</html>
